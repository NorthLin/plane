name: Publish images
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (use a new immutable version)
        required: true
        default: v1.5.2
      smoke_only:
        description: Verify existing images without rebuilding
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-images-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false
env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
jobs:
  build:
    if: ${{ !inputs.smoke_only && (github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-cli.')) }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, admin, space, live, proxy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - component: backend
            context: apps/api
            file: apps/api/Dockerfile.api
          - component: frontend
            context: .
            file: apps/web/Dockerfile.web
          - component: admin
            context: .
            file: apps/admin/Dockerfile.admin
          - component: space
            context: .
            file: apps/space/Dockerfile.space
          - component: live
            context: .
            file: apps/live/Dockerfile.live
          - component: proxy
            context: apps/proxy
            file: apps/proxy/Dockerfile.ce
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push native image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/plane-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
  manifest:
    needs: build
    strategy:
      matrix:
        component: [backend, frontend, admin, space, live, proxy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish version manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/plane-${{ matrix.component }}
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          test "${#refs[@]}" = 2
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
  smoke:
    needs: manifest
    if: ${{ always() && (needs.manifest.result == 'success' || inputs.smoke_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum
      - name: Prepare isolated deployment
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          CGO_ENABLED=0 go build -C apps/cli -o ../../plane .
          bash configure.sh http://localhost:8080 "$VERSION"
          echo 'LISTEN_HTTP_PORT=8080' >> .env
          echo 'API_KEY_RATE_LIMIT=10000/hour' >> .env
          docker compose config --quiet
          docker compose pull
          docker compose up -d
          docker compose ps -a
          docker compose run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check web and API readiness
        run: |
          for n in $(seq 1 120); do
            if curl --max-time 5 -fsS http://localhost:8080/api/instances/ >/dev/null; then break; fi
            sleep 5
          done
          curl --max-time 10 -fsS http://localhost:8080/ >/dev/null
          curl --max-time 10 -fsS http://localhost:8080/api/instances/ >/dev/null
          docker compose cp plane api:/tmp/plane
          docker compose cp apps/cli/tests/e2e.py api:/tmp/cli-e2e.py
          docker compose exec -T -e PYTHONPATH=/code -e PLANE_E2E_SERVER=http://proxy -e PLANE_CLI_BINARY=/tmp/plane api python /tmp/cli-e2e.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify live updates in Chromium
        env:
          PLANE_E2E_SERVER: http://localhost:8080
          PLANE_LIVE_FIXTURE: /tmp/live-fixture.json
          PLANE_CLI_BINARY: ${{ github.workspace }}/plane
          NODE_PATH: /tmp/plane-browser/node_modules
        run: |
          npm install --prefix /tmp/plane-browser playwright
          /tmp/plane-browser/node_modules/.bin/playwright install --with-deps chromium
          docker compose cp apps/web/tests/e2e/live-fixture.py api:/tmp/live-fixture.py
          docker compose exec -T -e PYTHONPATH=/code api python /tmp/live-fixture.py prepare /tmp/live-fixture.json
          docker compose cp api:/tmp/live-fixture.json /tmp/live-fixture.json
          chmod 600 /tmp/live-fixture.json
          node apps/web/tests/e2e/live-updates.cjs
      - name: Remove browser fixture
        if: always()
        run: |
          docker compose exec -T -e PYTHONPATH=/code api python /tmp/live-fixture.py cleanup /tmp/live-fixture.json || true
          rm -f /tmp/live-fixture.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Clean up
        if: always()
        run: docker compose down -v
