name: Publish CLI
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true
        default: v1.5.2
permissions:
  contents: write
concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum
      - run: go test -race ./...
      - run: go vet ./...
  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum
      - name: Package CLI
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: bash apps/cli/package.sh "$RELEASE_TAG"
      - name: Package deployment and installer
        run: |
          cp DEPLOYMENT.md apps/cli/dist/release/README.md
          tar -czf apps/cli/dist/release/plane-deployment.tar.gz docker-compose.yml configure.sh DEPLOYMENT.md -C apps/cli/dist/release README.md
          rm apps/cli/dist/release/README.md
          cp apps/cli/install.sh apps/cli/dist/release/install.sh
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" apps/cli/dist/release/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --title "Plane $RELEASE_TAG" --notes-file deployments/release/NOTES.md
          else
            gh release create "$RELEASE_TAG" apps/cli/dist/release/* --verify-tag --title "Plane $RELEASE_TAG" --notes-file deployments/release/NOTES.md
          fi
  verify-download:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - name: Install published archive
        env:
          PLANE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          bash apps/cli/install.sh
          "$HOME/.local/bin/plane" --version
          "$HOME/.local/bin/plane" callbacks add --help
