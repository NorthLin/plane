name: Plane CLI
on:
  pull_request:
    paths: ["apps/cli/**", ".github/workflows/cli.yml"]
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o dist/plane .
  binaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum
      - run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o dist/plane-$os-$arch .
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plane-cli
          path: apps/cli/dist/plane-*
